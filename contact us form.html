<!DOCTYPE html>
<html lang="en">
<head>
  <title>Contact Us</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Salim">
  <meta name="description" content="Contact Us / User Registration Form">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Specific styles for the form page */
    .form-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-color: #f9f6f0;
    }

    .form-box {
      background: #fff;
      border: 2px solid #b0a898;
      border-radius: 6px;
      padding: 36px 40px;
      width: 100%;
      max-width: 480px;
    }

    .form-box h2 {
      font-size: 1.5rem;
      margin-bottom: 6px;
      color: #1a1a1a;
      text-align: center;
    }

    .form-box .subtitle {
      text-align: center;
      font-size: 0.88rem;
      color: #777;
      margin-bottom: 28px;
      font-family: Arial, sans-serif;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 6px;
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="password"],
    .form-group input[type="date"],
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid #c8bfaf;
      border-radius: 4px;
      font-size: 0.92rem;
      font-family: Arial, sans-serif;
      background-color: #fdfaf5;
      color: #2e2e2e;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: #f0a500;
      background-color: #fff;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 90px;
    }

    /* Styling for radio and checkbox groups */
    .radio-group,
    .checkbox-group {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 4px;
    }

    .radio-group label,
    .checkbox-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .group-label {
      display: block;
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 8px;
    }

    /* Styling for the submit button */
    .submit-btn {
      width: 100%;
      padding: 11px;
      background-color: #2e2e2e;
      color: #f9f6f0;
      border: 2px solid #2e2e2e;
      border-radius: 4px;
      font-size: 0.95rem;
      font-family: Arial, sans-serif;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      margin-top: 8px;
    }

    .submit-btn:hover {
      background-color: #f0a500;
      border-color: #f0a500;
      color: #1a1a1a;
    }

    .back-link {
      text-align: center;
      margin-top: 16px;
      font-family: Arial, sans-serif;
      font-size: 0.85rem;
    }

    .back-link a {
      color: #f0a500;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .divider {
      border: none;
      border-top: 1px solid #e0d8cc;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <!-- Nav (it is the same as that of main site) -->
  <nav>
    <div class="logo">Build MySite</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="contact us form.html" class="active">Contact Us</a></li>
    </ul>
  </nav>

  <!-- Form Section -->
  <div class="form-page">
    <div class="form-box">
      <h2>User Registration</h2>
      <p class="subtitle">Fill in the details below to get in touch or register.</p>

      <form method="POST" action="">

        <div class="form-group">
          <label for="fname">Full Name</label>
          <input type="text" id="fname" name="name" placeholder="Enter your name" autofocus required />
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="bdate" required />
        </div>

        <div class="form-group">
          <label for="em">Email Address</label>
          <input type="email" id="em" name="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="pw">Password</label>
          <input type="password" id="pw" name="password" placeholder="Create a password" required />
        </div>

        <hr class="divider" />

        <div class="form-group">
          <span class="group-label">Gender</span>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="Male" /> Male</label>
            <label><input type="radio" name="gender" value="Female" /> Female</label>
          </div>
        </div>

        <div class="form-group">
          <span class="group-label">Favourite Sites</span>
          <div class="checkbox-group">
            <label><input type="checkbox" id="tw" name="chk1" value="Twitter" /> Twitter</label>
            <label><input type="checkbox" id="fb" name="chk2" value="Facebook" /> Facebook</label>
            <label><input type="checkbox" id="wa" name="chk3" value="Whatsapp" /> WhatsApp</label>
          </div>
        </div>

        <hr class="divider" />

        <div class="form-group">
          <label for="description">Describe Yourself</label>
          <textarea id="description" name="description" placeholder="Tell us a little about yourself..."></textarea>
        </div>

        <div class="form-group">
          <label for="country">Select Your Country</label>
          <select id="country" name="country">
            <option value="">-- Choose a country --</option>
            <option value="Uganda">Uganda</option>
            <option value="Kenya">Kenya</option>
            <option value="Tanzania">Tanzania</option>
            <option value="Rwanda">Rwanda</option>
            <option value="Egypt">Egypt</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">Register</button>

      </form>

      <p class="back-link"><a href="index.html">← Back to Home</a></p>
    </div>
  </div>

  <!--Styling for the Footer section -->
  <footer>
    <p>&copy; 2026 MySite. Made with Love for coding!</p>
    </p>
    <p><a href="form.html">Contact Us</a> &nbsp;|&nbsp; <a href="#">Privacy</a></p>
  </footer>

</body>
</html>
